<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102a43"><title>TRONSUN AI Overseas Sales</title><link rel="stylesheet" href="style.css"></head><body><section id="loginBox" class="login"><div class="card login-card"><div id="loginLang" class="lang"></div><h1>TRONSUN</h1><p id="loginSubtitle" class="muted"></p><label id="passwordLabel" for="pw"></label><input id="pw" type="password" autocomplete="current-password"><button id="loginBtn" class="btn wide"></button><p id="loginMsg" class="small muted"></p></div></section><div id="appBox" class="app hide"><aside class="side"><div class="brand">TRONSUN</div><nav id="nav"></nav></aside><main><header><div><h2 id="title"></h2><div id="cloudSubtitle" class="small muted"></div><div id="liveStatus" class="small muted">实时同步：每30秒刷新</div></div><div class="actions"><div id="appLang" class="lang"></div><button id="backupBtn" class="btn secondary"></button><button id="logoutBtn" class="btn secondary"></button></div></header><div id="view"></div></main></div><dialog id="dlg"><div id="dlgbody"></div><div class="dialog-actions"><button id="closeDialogBtn" class="btn secondary"></button></div></dialog><div id="toast" class="toast hide"></div><script src="app.js"></script><script>(function(){function syncLabel(){var s=document.getElementById('liveStatus');if(!s)return;var zh=(typeof LANG!=='undefined'?LANG:'zh')==='zh';s.textContent=(zh?'实时同步 · 上次刷新：':'Live sync · Last refresh: ')+new Date().toLocaleTimeString();}syncLabel();setInterval(function(){try{var app=document.getElementById('appBox');if(!app||app.classList.contains('hide'))return;syncLabel();if(typeof PAGE!=='undefined'&&['dashboard','leads','quotes','orders'].includes(PAGE)&&typeof render==='function'){render();}}catch(e){console.warn('live refresh',e)}},30000);}());</script></body></html>
